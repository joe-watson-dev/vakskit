<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VaksKit UI Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
/* Follows the user's references (Jets, Captures): white airy surface, large soft corners,
   one vivid brand colour only on the main action (with a coloured glow), a full-width pill
   switch, soft grey rows with chevrons, outlined tinted tags, navy text, Plus Jakarta Sans. */
:root {
  --font: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --stage: #e8e9f0; --stage-ink: #16154a; --stage-ink-2: #6e7091;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --stage: #08081a; --stage-ink: #eeeefb; --stage-ink-2: #9b9dbb; color-scheme: dark; } }
:root[data-theme="dark"] { --stage: #08081a; --stage-ink: #eeeefb; --stage-ink-2: #9b9dbb; color-scheme: dark; }

/* VaksKit tokens */
.vk {
  --surface: #ffffff; --row: #f5f6fa; --border: #ecedf3;
  --ink: #16154a; --ink-2: #6e7091; --ink-3: #a3a5bd;
  --primary: #5b5cf0; --primary-2: #7a7bf7; --on-primary: #ffffff; --glow: rgb(91 92 240 / .38); --tint: #eeeefe;
  --green: #12a150; --green-tint: #e8f7ee; --orange: #e0791f; --orange-tint: #fff3e6; --grey-tint: #f1f2f6;
  --shadow: 0 1px 2px rgb(22 21 74 / .04), 0 18px 40px -18px rgb(22 21 74 / .25);
  color-scheme: light;
}
.vk.dark {
  --surface: #14142a; --row: #1c1c35; --border: #282845;
  --ink: #eeeefb; --ink-2: #9b9dbb; --ink-3: #6b6d8c;
  --primary: #6f70ff; --primary-2: #8b8cff; --on-primary: #ffffff; --glow: rgb(111 112 255 / .35); --tint: #23235a;
  --green: #3ddc84; --green-tint: rgb(61 220 132 / .12); --orange: #ffa94d; --orange-tint: rgb(255 169 77 / .12); --grey-tint: #22223c;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 24px 50px -20px rgb(0 0 0 / .7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--stage); color: var(--stage-ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--primary, #5b5cf0); outline-offset: 2px; border-radius: 10px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.stage { max-width: 1320px; margin: 0 auto; padding: 32px 16px 64px; display: grid; gap: 26px; }
.stage header h1 { margin: 0; font-size: 1.45rem; font-weight: 800; letter-spacing: -.02em; }
.stage header p { margin: 6px 0 0; color: var(--stage-ink-2); font-size: .92rem; max-width: 66ch; line-height: 1.55; }
.frames { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; align-items: flex-start; }
.frame-wrap { display: grid; gap: 10px; justify-items: center; }
.frame-wrap > span { font-size: .78rem; font-weight: 600; color: var(--stage-ink-2); }

/* ---------- the panel ---------- */
.vk {
  width: 372px; height: 740px;
  background: var(--surface); color: var(--ink);
  border-radius: 24px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden; position: relative;
  font-size: 15px;
}
.head { display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 14px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.12em; letter-spacing: -.01em; }
.logo { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--primary-2), var(--primary)); display: grid; place-items: center; box-shadow: 0 6px 14px -6px var(--glow); }
.logo svg { width: 18px; height: 18px; }
.head-actions { display: flex; gap: 6px; }
.ibtn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); }
.ibtn:hover { background: var(--row); color: var(--ink); }
.ibtn svg { width: 19px; height: 19px; }
.body { flex: 1; overflow-y: auto; padding: 0 20px 22px; display: grid; gap: 14px; align-content: start; }

.site { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; background: var(--row); }
.fav { width: 32px; height: 32px; border-radius: 10px; background: #0f3d3e; color: #c8f560; display: grid; place-items: center; font-weight: 800; font-size: .72em; flex-shrink: 0; }
.site .txt { flex: 1; min-width: 0; }
.site b { display: block; font-size: .9em; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.site small { display: flex; align-items: center; gap: 6px; font-size: .76em; color: var(--ink-2); }
.site small i { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

/* Captures-style action tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { border-radius: 20px; padding: 16px; min-height: 152px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; text-align: left; transition: transform .15s ease, box-shadow .15s ease; }
.tile:hover { transform: translateY(-2px); }
.tile .ic { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; }
.tile .ic svg { width: 20px; height: 20px; }
.tile b { display: block; font-size: 1.02em; font-weight: 700; letter-spacing: -.01em; }
.tile small { display: block; font-size: .78em; margin-top: 2px; }
.tile.primary { background: linear-gradient(150deg, var(--primary-2) 0%, var(--primary) 60%); color: var(--on-primary); box-shadow: 0 16px 30px -12px var(--glow); }
.tile.primary .ic { background: rgb(255 255 255 / .2); }
.tile.primary small { color: rgb(255 255 255 / .78); }
.tile.soft { background: var(--row); }
.tile.soft .ic { background: var(--surface); color: var(--ink); box-shadow: 0 2px 6px rgb(22 21 74 / .06); }
.tile.soft small { color: var(--ink-3); }
.score { font-size: 2.15em; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
.score span { font-size: .42em; font-weight: 600; opacity: .75; letter-spacing: 0; margin-left: 2px; }

.label { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
.label h2 { margin: 0; font-size: 1.02em; font-weight: 700; letter-spacing: -.01em; }
.label button { font-size: .8em; font-weight: 600; color: var(--primary); }

/* Captures-style rows */
.rows { display: grid; gap: 10px; }
.row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: var(--row); font-weight: 600; font-size: .92em; width: 100%; }
.row:hover { background: var(--tint); }
.row svg { width: 19px; height: 19px; flex-shrink: 0; color: var(--ink-2); }
.row .grow { flex: 1; min-width: 0; }
.row .chev { width: 16px; height: 16px; color: var(--ink-3); }

/* Jets-style tags */
.tag { font-size: .74em; font-weight: 700; padding: 4px 11px; border-radius: 999px; border: 1.5px solid currentColor; white-space: nowrap; }
.tag.violet { color: var(--primary); background: var(--tint); }
.tag.green { color: var(--green); background: var(--green-tint); }
.tag.orange { color: var(--orange); background: var(--orange-tint); }
.tag.grey { color: var(--ink-2); background: var(--grey-tint); border-color: var(--border); }

/* Jets-style cards (checks) */
.cards { display: grid; gap: 10px; }
.card { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 14px 16px; border-radius: 16px; border: 1.5px solid var(--border); background: var(--surface); }
.card b { font-size: .95em; font-weight: 700; }
.card p { grid-column: 1 / -1; margin: 0; font-size: .82em; color: var(--ink-2); line-height: 1.5; }
.card.done { background: var(--row); border-color: transparent; }
.card.done b { color: var(--ink-3); text-decoration: line-through; font-weight: 600; }

/* Jets-style pill switch */
.switch { display: grid; grid-template-columns: 1fr 1fr; padding: 5px; border-radius: 999px; background: var(--row); }
.switch button { padding: 12px; border-radius: 999px; font-weight: 600; font-size: .92em; color: var(--ink-2); text-align: center; transition: background .2s, color .2s; }
.switch button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); box-shadow: 0 8px 18px -8px var(--glow); }

.doc-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.doc-title h2 { margin: 0; font-size: 1.12em; font-weight: 800; letter-spacing: -.02em; line-height: 1.25; }
.doc-title small { display: block; font-size: .78em; color: var(--ink-2); font-weight: 500; margin-top: 3px; }
pre.md { margin: 0; padding: 16px; border-radius: 18px; border: 1.5px solid var(--border); font: .76em/1.75 var(--mono); white-space: pre-wrap; word-break: break-word; color: var(--ink); }
pre.md .fm { color: var(--ink-3); }
pre.md .h { color: var(--primary); font-weight: 600; }
pre.md .lk { color: var(--green); }
.reading { padding: 18px; border-radius: 18px; border: 1.5px solid var(--border); font-size: .9em; line-height: 1.7; }
.reading h1 { font-size: 1.35em; line-height: 1.2; margin: 0 0 .5em; letter-spacing: -.02em; }
.reading h2 { font-size: 1.08em; margin: 1.3em 0 .3em; }
.reading h3 { font-size: .98em; margin: 1.1em 0 .2em; }
.reading p { margin: 0 0 .8em; color: var(--ink-2); }
.reading img { width: 100%; height: 110px; object-fit: cover; border-radius: 12px; background: var(--row); }
.reading ol, .reading ul { padding-left: 1.2em; color: var(--ink-2); }

.dock { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 14px 20px 20px; border-top: 1px solid var(--border); background: var(--surface); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 18px; border-radius: 999px; font-weight: 700; font-size: .92em; white-space: nowrap; }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--primary); color: var(--on-primary); box-shadow: 0 12px 24px -12px var(--glow); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.outline { border: 1.5px solid var(--border); color: var(--ink); }
.btn.outline:hover { background: var(--row); }

.promo { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 18px; background: var(--row); }
.promo .txt { flex: 1; }
.promo b { display: block; font-size: .92em; font-weight: 700; }
.promo small { font-size: .78em; color: var(--ink-2); }
.promo .btn { padding: 10px 16px; font-size: .84em; }

.toast { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 11px 18px; border-radius: 999px; font-weight: 700; font-size: .84em; white-space: nowrap; z-index: 5; animation: pop .2s ease; }
@keyframes pop { from { transform: translate(-50%, 8px); opacity: 0; } }
</style>
</head>
<body>
<div class="stage">
  <header>
    <h1>VaksKit · side panel</h1>
    <p>Built from your references: Jets and Captures. Home and Markdown, in light and dark. Every tile, row and switch works. Data: the real Markdown VaksKit now produces for holdmyseatnow.com.</p>
  </header>
  <div class="frames">
    <div class="frame-wrap"><div class="vk" data-screen="home"></div><span>Home · light</span></div>
    <div class="frame-wrap"><div class="vk" data-screen="markdown"></div><span>Markdown · light</span></div>
    <div class="frame-wrap"><div class="vk dark" data-screen="home"></div><span>Home · dark</span></div>
    <div class="frame-wrap"><div class="vk dark" data-screen="seo"></div><span>SEO checks · dark</span></div>
  </div>
</div>

<script>
(() => {
  const I = {
    logo: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 7.5 12 17l5.5-9.5"/></svg>',
    more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
    refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8M21 3v5h-5"/></svg>',
    gauge: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.3 19a10 10 0 1 1 17.4 0"/></svg>',
    doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>',
    braces: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1M16 21h1a2 2 0 0 0 2-2v-5a2 2 0 0 1 2-2 2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/></svg>',
    bot: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4M9 13v2M15 13v2"/></svg>',
    code: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg>',
    share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>',
    chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="13" height="13" rx="3"/><path d="M4 16V5a2 2 0 0 1 2-2h11"/></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5M5 21h14"/></svg>',
    expand: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>',
  };

  const MD = `---
title: "Book Flights Now, Pay Later | Hold My Seat Now"
description: "Book your flight today and pay over time."
site: "holdmyseatnow.com"
source: "https://www.holdmyseatnow.com/"
lang: "en"
---

# Book your flight now. Pay over time.

Traveling shouldn’t drain your wallet. We secure your ticket instantly with flexible repayment options.

## Travel smarter, not harder

We handle the booking stress so you can focus on what matters - the adventure ahead.

### Tickets secured instantly

We purchase your tickets immediately. No waiting, no risk of missing out.

### Flexible payment plans

Split your payments into weekly, biweekly, or monthly installments that fit your budget.

## Three simple steps

1. Find your flight
2. Pay small upfront fee
3. Pay the rest later

## Questions? We've got answers.

[Secure Your Trip](https://www.holdmyseatnow.com/#home-flights)
`;
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const paint = (t) => esc(t)
    .replace(/^(---[\s\S]*?---)/, '<span class="fm">$1</span>')
    .replace(/^(#{1,6} .*)$/gm, '<span class="h">$1</span>')
    .replace(/(\]\()([^)]+)(\))/g, '$1<span class="lk">$2</span>$3');

  const head = (vk, s) => s === 'home'
    ? `<div class="head"><div class="brand"><span class="logo">${I.logo}</span>VaksKit</div>
        <div class="head-actions"><button class="ibtn" data-act="theme" aria-label="Switch theme">${vk.classList.contains('dark') ? I.moon : I.sun}</button><button class="ibtn" aria-label="More options" data-act="toast" data-msg="Settings, history and help">${I.more}</button></div></div>`
    : `<div class="head"><button class="brand" data-go="home" style="gap:8px"><span class="ibtn" style="width:32px;height:32px;background:var(--row)">${I.back}</span>${s === 'markdown' ? 'Markdown' : 'SEO checks'}</button>
        <div class="head-actions"><button class="ibtn" aria-label="More options" data-act="toast" data-msg="Settings, history and help">${I.more}</button></div></div>`;

  const site = `<div class="site"><span class="fav">HM</span><div class="txt"><b>holdmyseatnow.com</b><small><i></i>Analyzed just now</small></div><button class="ibtn" aria-label="Analyze again" data-act="toast" data-msg="Analyzed again">${I.refresh}</button></div>`;

  function home() {
    return `<div class="body">
      ${site}
      <div class="tiles">
        <button class="tile primary" data-go="seo"><span class="ic">${I.gauge}</span><span><span class="score">92<span>/100</span></span><b>SEO report</b><small>2 things to improve</small></span></button>
        <button class="tile soft" data-go="markdown"><span class="ic">${I.doc}</span><span><b>Markdown</b><small>556 words · tap to copy</small></span></button>
      </div>
      <div class="label"><h2>Quick actions</h2></div>
      <div class="rows">
        <button class="row" data-act="toast" data-msg="SEO copied as JSON">${I.braces}<span class="grow">Export SEO</span><span class="tag violet">JSON · TS</span>${I.chev}</button>
        <button class="row" data-act="toast" data-msg="Share card preview">${I.share}<span class="grow">Share preview</span><span class="tag green">Ready</span>${I.chev}</button>
        <button class="row" data-act="toast" data-msg="llms.txt and AI crawlers">${I.bot}<span class="grow">AI readers</span><span class="tag orange">No llms.txt</span>${I.chev}</button>
        <button class="row" data-act="toast" data-msg="Markdown → HTML converter">${I.code}<span class="grow">Markdown → HTML</span>${I.chev}</button>
      </div>
    </div>`;
  }

  function markdown(vk) {
    const view = vk.dataset.view || 'md';
    return `<div class="body">
      <div class="switch" role="group" aria-label="View"><button data-view="md" aria-pressed="${view === 'md'}">Markdown</button><button data-view="preview" aria-pressed="${view === 'preview'}">Preview</button></div>
      <div class="doc-title"><div><h2>Book your flight now. Pay over time.</h2><small>holdmyseatnow.com · 556 words · 8 sections</small></div><span class="tag violet">.md</span></div>
      ${view === 'md' ? `<pre class="md">${paint(MD)}</pre>` : `<div class="reading">${window.marked ? marked.parse(MD.replace(/^---[\s\S]*?---\n/, '')) : ''}</div>`}
    </div>
    <div class="dock"><button class="btn primary" data-act="toast" data-msg="Markdown copied">${I.copy}Copy Markdown</button><button class="btn outline" data-act="toast" data-msg="Saved holdmyseatnow-com.md" aria-label="Download .md">${I.down}</button></div>`;
  }

  function seo() {
    return `<div class="body">
      ${site}
      <div class="switch" role="group" aria-label="Checks"><button aria-pressed="true">To review · 2</button><button data-act="toast" data-msg="12 checks passed">Passed · 12</button></div>
      <div class="label"><h2>Today, 4 November</h2></div>
      <div class="cards">
        <div class="card"><b>Description cut on phones</b><span class="tag orange">Improve</span><p>Google shows about 120 characters on mobile. Move the key words to the start.</p></div>
        <div class="card"><b>Add an llms.txt file</b><span class="tag violet">AI</span><p>A short guide that helps ChatGPT and Claude describe your site correctly.</p></div>
        <div class="card"><b>Title length</b><span class="tag green">Good</span><p>46 of 60 characters. Fully visible in search.</p></div>
        <div class="card"><b>Share card</b><span class="tag green">Good</span><p>og:title, og:description and a 1200 × 630 image are set.</p></div>
        <div class="card done"><b>One main heading (H1)</b><span class="tag grey">Done</span></div>
      </div>
    </div>`;
  }

  const SCREENS = { home, markdown, seo };
  function render(vk) {
    const s = vk.dataset.screen;
    vk.innerHTML = head(vk, s) + SCREENS[s](vk);
  }
  function toast(vk, msg) {
    vk.querySelector('.toast')?.remove();
    const t = document.createElement('div'); t.className = 'toast'; t.role = 'status'; t.textContent = msg;
    vk.appendChild(t); setTimeout(() => t.remove(), 1600);
  }
  document.querySelectorAll('.vk').forEach(render);
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button'); const vk = e.target.closest('.vk');
    if (!b || !vk) return;
    if (b.dataset.go) { vk.dataset.screen = b.dataset.go; return render(vk); }
    if (b.dataset.view) { vk.dataset.view = b.dataset.view; return render(vk); }
    if (b.dataset.act === 'theme') { vk.classList.toggle('dark'); return render(vk); }
    if (b.dataset.act === 'toast') return toast(vk, b.dataset.msg);
  });
})();
</script>
</body>
</html>
